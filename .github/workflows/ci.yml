name: ci

on:
  push:
    branches: [main, harness-candidate]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: fast (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows / Python 3.11
            os: windows-latest
            python: "3.11"
          - label: Windows / Python 3.13
            os: windows-latest
            python: "3.13"
          - label: Linux / Python 3.11
            os: ubuntu-latest
            python: "3.11"
          - label: Linux / Python 3.13
            os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m tools.check fast
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-fast-${{ matrix.os }}-py${{ matrix.python }}
          path: outputs/checks/fast
          if-no-files-found: ignore
          overwrite: true

  io-posix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m tools.check io
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-io-posix
          path: outputs/checks/io
          if-no-files-found: ignore
          overwrite: true

  io-liburing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y liburing-dev
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m tools.check liburing
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-io-liburing
          path: outputs/checks/liburing
          if-no-files-found: ignore
          overwrite: true

  llama-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m tools.check llama
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-llama
          path: outputs/checks/llama
          if-no-files-found: ignore
          overwrite: true
